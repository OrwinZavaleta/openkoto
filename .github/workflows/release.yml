name: "publish"

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
    branches:
      - main

jobs:
  publish-tauri:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libglib2.0-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: setup node
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install frontend dependencies
        run: npm install
        working-directory: ./textlingo-desktop

      - name: download sidecar binaries
        run: |
          chmod +x script/download_binaries.sh
          bash script/download_binaries.sh
        shell: bash

      - name: build bundled PDF sidecar
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -e ./textlingo-desktop/pdf-sidecar
          cd textlingo-desktop/pdf-sidecar
          python build.py
          cd ../..
          chmod +x script/sync_pdf_sidecar_binaries.sh
          bash script/sync_pdf_sidecar_binaries.sh
        shell: bash
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"

      - name: verify bundled PDF sidecar
        run: |
          bash script/sync_pdf_sidecar_binaries.sh
          bash script/verify_pdf_sidecar_binary.sh
          ls -la textlingo-desktop/src-tauri/binaries
        shell: bash

      - name: stage PDF offline assets
        run: python script/build_pdf_offline_assets.py
        shell: bash

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "OpenKoto Desktop Linux ${{ github.ref_name }}"
          releaseBody: "Compilación oficial de OpenKoto en formato AppImage listo para Fedora."
          releaseDraft: false
          prerelease: false
          projectPath: "./textlingo-desktop"
          args: "--bundles appimage"
